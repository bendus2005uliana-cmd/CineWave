<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Фільм — CineWave</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: rgb(38, 15, 70);
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: rgb(195, 154, 232);
            margin-top: 0;
        }

        nav {
            text-align: center;
            margin: 25px 0 40px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-size: 16px;
        }

        nav a:hover {
            color: rgb(195, 154, 232);
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 18px;
            background: rgb(55, 20, 85);
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-button:hover {
            background: rgb(75, 30, 105);
        }

        .movie-details {
            max-width: 1000px;
            margin: auto;
            background: rgb(55, 20, 85);
            border-radius: 18px;
            padding: 30px;
            display: flex;
            gap: 35px;
            box-sizing: border-box;
        }

        .movie-details img {
            width: 320px;
            max-height: 470px;
            object-fit: cover;
            border-radius: 14px;
        }

        .movie-info {
            flex: 1;
        }

        .movie-info h2 {
            font-size: 34px;
            margin-top: 0;
            color: rgb(195, 154, 232);
        }

        .movie-info p {
            line-height: 1.6;
            font-size: 17px;
        }

        .movie-meta {
            color: rgb(210, 190, 225);
        }

        .rating {
            color: rgb(255, 220, 120);
            font-size: 18px;
        }

        .description {
            margin-top: 25px;
        }

        .info-block {
            margin-top: 20px;
        }

        .info-block strong {
            color: rgb(195, 154, 232);
        }

        .session-button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 24px;
            background: rgb(195, 154, 232);
            color: rgb(38, 15, 70);
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .session-button:hover {
            opacity: 0.85;
        }

        .error {
            max-width: 700px;
            margin: 60px auto;
            text-align: center;
            background: rgb(55, 20, 85);
            padding: 40px;
            border-radius: 15px;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .movie-details {
                flex-direction: column;
                padding: 20px;
            }

            .movie-details img {
                width: 100%;
                max-height: 500px;
            }

            .movie-info h2 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <h1>✦CineWave</h1>
    <p class="subtitle">cinema</p>

    <nav>
        <a href="index.html">⌂ Головна</a>
        <a href="movies.html">🎬 Фільми</a>
        <a href="sessions.html">◷ Сеанси</a>
        <a href="tickets.html">🎟 Квитки</a>
        <a href="profile.html">👤 Профіль</a>
    </nav>

    <main id="movie-container"></main>

    <script>

        const films = {

            dune: {
                title: "Дюна: Частина друга",
                poster: "images/dune2.jpg",
                genre: "Фантастика",
                duration: "2 год 46 хв",
                age: "12+",
                rating: "8.7 / 10",
                director: "Дені Вільньов",
                actors: "Тімоті Шаламе, Зендея, Ребекка Фергюсон, Джош Бролін, Остін Батлер",
                description: "Після подій першої частини Пол Атріда опиняється серед фременів — народу пустельної планети Арракіс. Він поступово пристосовується до їхнього способу життя, зближується з Чані та намагається зрозуміти власне майбутнє. Тим часом боротьба за контроль над Арракісом загострюється, а дім Харконненів прагне повернути владу над планетою. Пол змушений зробити складний вибір між особистими почуттями, долею своєї родини та майбутнім усього народу. Фільм продовжує історію боротьби за найцінніший ресурс у всесвіті — пряність, яка робить можливими міжзоряні подорожі."
            },

            avatar: {
                title: "Аватар: Шлях води",
                poster: "images/avatar.jpeg",
                genre: "Фантастика",
                duration: "3 год 12 хв",
                age: "12+",
                rating: "7.8 / 10",
                director: "Джеймс Кемерон",
                actors: "Сем Вортінгтон, Зої Салдана, Сігурні Вівер, Стівен Ленг, Кейт Вінслет",
                description: "Минуло багато років після подій першого фільму. Джейк Саллі та Нейтірі створили сім'ю і виховують дітей на Пандорі. Однак повернення людей на планету змушує родину залишити свій дім. Герої знаходять прихисток у океанського народу Меткайїна, який живе серед коралових рифів і має зовсім інший спосіб життя. Джейк та його родина повинні навчитися жити у водному світі, пристосуватися до нових правил і водночас захищати одне одного від небезпеки."
            },

            oppenheimer: {
                title: "Оппенгеймер",
                poster: "images/oppenheimer.jpg",
                genre: "Драма",
                duration: "3 год",
                age: "16+",
                rating: "8.6 / 10",
                director: "Крістофер Нолан",
                actors: "Кілліан Мерфі, Емілі Блант, Метт Деймон, Роберт Дауні-молодший, Флоренс П'ю",
                description: "Фільм розповідає історію американського фізика Роберта Оппенгеймера, який став одним із головних керівників Манхеттенського проєкту під час Другої світової війни. Вчені з різних країн працюють над створенням нової зброї, яка може змінити хід війни. Оппенгеймер опиняється в центрі масштабної наукової та політичної події. Після успішного випробування першої атомної бомби він починає усвідомлювати наслідки власної роботи."
            },

            interstellar: {
                title: "Інтерстеллар",
                poster: "images/interstellar.jpg",
                genre: "Фантастика",
                duration: "2 год 49 хв",
                age: "12+",
                rating: "8.7 / 10",
                director: "Крістофер Нолан",
                actors: "Меттью Макконагі, Енн Гетевей, Джессіка Честейн, Маккензі Фой, Майкл Кейн",
                description: "У майбутньому Земля поступово стає непридатною для життя через екологічні проблеми та нестачу продовольства. Колишній пілот Купер живе разом із дітьми та працює фермером, але несподівано отримує можливість взяти участь у секретній космічній місії. Разом із групою науковців він вирушає крізь червоточину біля Сатурна, яка може привести до інших галактик."
            },

            topgun: {
                title: "Топ Ґан: Меверік",
                poster: "images/topgun.jpg",
                genre: "Бойовик",
                duration: "2 год 11 хв",
                age: "12+",
                rating: "8.2 / 10",
                director: "Джозеф Косінскі",
                actors: "Том Круз, Майлз Теллер, Дженніфер Коннеллі, Джон Гемм, Глен Пауелл",
                description: "Піт Мітчелл, відомий під позивним Меверік, багато років залишається одним із найкращих льотчиків ВМС США. Його повертають до елітної льотної школи Top Gun, щоб підготувати групу молодих пілотів до надзвичайно складної місії. Серед них опиняється Бредлі Бредшоу — син покійного друга Меверіка."
            },

            spiderman: {
                title: "Людина-павук: Додому шляху нема",
                poster: "images/spiderman.jpg",
                genre: "Фантастика",
                duration: "2 год 28 хв",
                age: "12+",
                rating: "8.2 / 10",
                director: "Джон Воттс",
                actors: "Том Голланд, Зендея, Бенедикт Камбербетч, Віллем Дефо, Альфред Моліна",
                description: "Після того як особу Людини-павука розкривають, життя Пітера Паркера та його близьких повністю змінюється. Пітер звертається до Доктора Стренджа з проханням змусити світ забути його справжню особу. Однак магічне заклинання виходить з-під контролю та відкриває доступ до інших всесвітів."
            }
        };


        const params = new URLSearchParams(window.location.search);

        const movieParam = params.get("movie");

        const container =
            document.getElementById("movie-container");


        let film = null;
        let isDynamic = false;


        // Спочатку шукаємо серед звичайних фільмів
        if (movieParam && films[movieParam]) {

            film = films[movieParam];

        } else if (movieParam) {

            // Якщо це фільм, доданий через адмінку
            const movieTitle =
                decodeURIComponent(movieParam);

            const addedMovies =
                JSON.parse(
                    localStorage.getItem("cinewaveMovies")
                ) || [];

            film =
                addedMovies.find(function(movie) {
                    return movie.title === movieTitle;
                });

            if (film) {
                isDynamic = true;
            }
        }


        // Якщо фільм не знайдено
        if (!film) {

            container.innerHTML = `
                <div class="error">
                    <h2>Фільм не знайдено</h2>
                    <p>
                        Можливо, цей фільм був видалений
                        або сторінка відкрита неправильно.
                    </p>

                    <a
                        href="movies.html"
                        class="session-button"
                    >
                        Повернутися до фільмів
                    </a>
                </div>
            `;

        } else {

            const director =
                film.director || "Не вказано";

            const actors =
                film.actors || "Не вказано";

            const rating =
                film.rating || "Новий фільм";


            let sessionsLink;

            if (isDynamic) {

                sessionsLink =
                    "sessions.html?movie=" +
                    encodeURIComponent(film.title);

            } else {

                sessionsLink =
                    "sessions.html?movie=" +
                    movieParam;
            }


            container.innerHTML = `

                <a
                    href="movies.html"
                    class="back-button"
                >
                    ← Назад до фільмів
                </a>

                <div class="movie-details">

                    <img
                        src="${film.poster}"
                        alt="${film.title}"
                        onerror="
                            this.src='images/dune2.jpg'
                        "
                    >

                    <div class="movie-info">

                        <h2>
                            ${film.title}
                        </h2>

                        <p class="movie-meta">
                            ${film.genre}
                            •
                            ${film.duration}
                            •
                            ${film.age}
                        </p>

                        <p class="rating">
                            ⭐ ${rating}
                        </p>

                        <div class="description">

                            <h3>Про фільм</h3>

                            <p>
                                ${film.description ||
                                "Опис фільму поки не додано."}
                            </p>

                        </div>

                        <div class="info-block">

                            <p>
                                <strong>Режисер:</strong>
                                ${director}
                            </p>

                            <p>
                                <strong>Актори:</strong>
                                ${actors}
                            </p>

                        </div>

                        <a
                            href="${sessionsLink}"
                            class="session-button"
                        >
                            Переглянути сеанси
                        </a>

                    </div>

                </div>
            `;
        }

    </script>

<script src="js/contact-button.js"></script>
</body>

</html>

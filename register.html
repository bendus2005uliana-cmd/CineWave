```html
<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Реєстрація — CineWave</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>✦CineWave</h1>
    <p class="subtitle">cinema</p>

    <nav>
        <a href="index.html">⌂ Головна</a>
        <a href="movies.html">🎬 Фільми</a>
        <a href="sessions.html">◷ Сеанси</a>
        <a href="halls.html">▣ Зали</a>
        <a href="tickets.html">🎟 Квитки</a>
        <a href="profile.html">👤 Профіль</a>
    </nav>

    <h2>Реєстрація</h2>

    <div class="movie-card">

        <section>

            <h3>👤 Створити акаунт</h3>

            <input
                type="text"
                id="register-name"
                placeholder="Ваше ім'я"
            >

            <br><br>

            <input
                type="email"
                id="register-email"
                placeholder="Ваш email"
            >

            <br><br>

            <input
                type="password"
                id="register-password"
                placeholder="Ваш пароль"
            >

            <br><br>

            <button id="register-button">
                Зареєструватися
            </button>

            <p id="register-message"></p>

            <p>
                Вже маєте акаунт?
                <a href="login.html">
                    Увійти →
                </a>
            </p>

        </section>

    </div>

    <script>
const registerButton =
    document.getElementById("register-button");

const registerMessage =
    document.getElementById("register-message");


registerButton.addEventListener("click", function() {

    const name =
        document.getElementById("register-name").value.trim();

    const email =
        document.getElementById("register-email").value.trim();

    const password =
        document.getElementById("register-password").value;


    if (
        name === "" ||
        email === "" ||
        password === ""
    ) {

        registerMessage.textContent =
            "❗ Заповніть усі поля.";

        return;
    }


    let users =
        JSON.parse(
            localStorage.getItem("cinewaveUsers")
        ) || [];


    const existingUser =
        users.find(function(user) {
            return user.email === email;
        });


    if (existingUser) {

        registerMessage.textContent =
            "❗ Такий email вже зареєстрований.";

        return;
    }


    const user = {

        name: name,
        email: email,
        password: password

    };


    users.push(user);


    localStorage.setItem(
        "cinewaveUsers",
        JSON.stringify(users)
    );


    localStorage.setItem(
        "cinewaveUser",
        JSON.stringify(user)
    );


    localStorage.setItem(
        "cinewaveLoggedIn",
        "true"
    );


    registerMessage.textContent =
        "✅ Реєстрація успішна!";


    setTimeout(function() {

        window.location.href =
            "profile.html";

    }, 800);

});
    </script>

<script src="js/contact-button.js"></script>

</body>

</html>
```
